name: CI with Gradle

on:
  push:
    branches: [ '**' ] # 모든 브랜치

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [common, company, config, delivery, eurekaServer, gateWay, hub, notification, order, product, user]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew :${{matrix.service}}:clean :${{matrix.service}}:build -x test --no-daemon