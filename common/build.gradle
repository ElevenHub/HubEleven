plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hubEleven'
version = '1.0.0'
description = 'Common utility module'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        register(MavenPublication) {
            from components.java
            groupId = 'com.github.ElevenHub'
            artifactId = 'common'
            version = '1.0.0'

            pom {
                name.set('HubEleven Common')
                description.set('Common module for shared utilities')
            }
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.7'
    implementation 'org.springframework.boot:spring-boot-starter:3.5.7'
    implementation 'org.springframework.data:spring-data-commons:3.5.5'
    implementation 'org.springframework.data:spring-data-jpa:3.5.5'
    implementation 'org.hibernate.orm:hibernate-core:6.6.33.Final'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'
}

tasks.named('test') {
    useJUnitPlatform()
}
