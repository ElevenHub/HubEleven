      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=${ZIPKIN_ENDPOINT}
    depends_on:
      eurekaServer:
        condition: service_healthy
      config:
        condition: service_healthy
    networks:
      - hubeleven-network

  product:
    image: hubeleven-product:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product
    container_name: product-service
    ports:
